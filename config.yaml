# ==========================================================================
#  CONFIGURATION DU MONITEUR VINTED
# ==========================================================================
#
# Ce fichier contrôle tout le comportement du script (moniteur_vinted.py).
# Vous pouvez le modifier avec n'importe quel éditeur de texte simple
# (Bloc-notes, TextEdit, VS Code...). Respectez bien les espaces
# d'indentation (le format YAML y est sensible) : le plus simple est de
# copier une ligne existante et de modifier seulement le texte utile.
#
# Après chaque modification, vous pouvez tester avec :
#     python moniteur_vinted.py --une-fois
# ==========================================================================


# --------------------------------------------------------------------------
# 1) RECHERCHES À SURVEILLER (une ou plusieurs — jusqu'à 10 recommandé)
# --------------------------------------------------------------------------
# Pour obtenir l'URL d'une recherche/catégorie :
#   1. Allez sur vinted.fr et configurez la recherche (catégorie, marque,
#      taille, état, texte recherché...) — SAUF le tri et le prix minimum,
#      qui sont gérés automatiquement par le script à chaque cycle.
#   2. Copiez l'adresse complète depuis la barre du navigateur.
#   3. Collez-la ci-dessous dans le champ "url".
#
# Champs de chaque recherche :
#   nom                : un nom court, juste pour vous repérer dans les logs
#   url                : l'URL de recherche Vinted copiée depuis votre navigateur
#   page_debut/page_fin: la plage de pages à observer. Pour capter les ventes
#                        très rapides dès la publication de l'annonce,
#                        utilisez des pages basses (ex. 1 à 2 ou 1 à 3) — une
#                        annonce vendue avant d'avoir eu le temps de glisser
#                        plus loin ne serait sinon jamais vue.
#   inclure_mots_cles  : (optionnel) l'annonce doit contenir au moins un de ces mots
#   exclure_mots_cles  : (optionnel) l'annonce est ignorée si elle contient un de ces mots
#
# Pour ajouter une catégorie de plus : dupliquez un bloc "- nom: ..." entier
# ci-dessous (même indentation) et changez juste le nom et l'url. Jusqu'à
# une dizaine de recherches reste raisonnable pour garder des cycles courts.
#
recherches:
  - nom: "Vêtements Homme (2050)"
    url: "https://www.vinted.fr/catalog?catalog[]=2050&price_to=84&currency=EUR"
    page_debut: 1
    page_fin: 20
    inclure_mots_cles: []
    exclure_mots_cles: []

  - nom: "Sweats Femme (13)"
    url: "https://www.vinted.fr/catalog?search_id=2507232808&catalog[]=13&price_from=80&currency=EUR&page=1&order=newest_first&time=1788359439&size_ids[]=4&size_ids[]=5"
    page_debut: 1
    page_fin: 5
    inclure_mots_cles: []
    exclure_mots_cles: []

  - nom: "Catégorie 79"
    url: "https://www.vinted.fr/catalog?search_id=2684475898&catalog[]=79&order=newest_first&page=1&time=1788360474&price_from=80&currency=EUR&size_ids[]=208&size_ids[]=209&size_ids[]=210"
    page_debut: 1
    page_fin: 4
    inclure_mots_cles: []
    exclure_mots_cles: []

  # Mise de côté (récupérable en décommentant) :
  # - nom: "Vêtements Homme (2312)"
  #   url: "https://www.vinted.fr/catalog?catalog[]=2312&price_to=84&currency=EUR"
  #   page_debut: 1
  #   page_fin: 2
  #   inclure_mots_cles: []
  #   exclure_mots_cles: []

  # Dupliquez ce type de bloc autant de fois que nécessaire pour couvrir
  # toutes vos catégories (copiez les lignes, collez, modifiez nom + url) :
  # - nom: "Une autre catégorie"
  #   url: "COLLEZ ICI LE LIEN VINTED DE CETTE CATÉGORIE"
  #   page_debut: 1
  #   page_fin: 2
  #   inclure_mots_cles: []
  #   exclure_mots_cles: []


# --------------------------------------------------------------------------
# 2) MODE ROTATION — pour surveiller BEAUCOUP de catégories sans rallonger
#    chaque cycle
# --------------------------------------------------------------------------
# - false (par défaut) : TOUTES les recherches ci-dessus sont vérifiées à
#   CHAQUE cycle, l'une après l'autre, dans le même onglet. Adapté si vous en
#   avez jusqu'à 2-3.
# - true : UNE SEULE recherche est vérifiée par cycle, choisie tour à tour
#   parmi toutes celles listées ci-dessus (ordre mélangé à chaque tour
#   complet). Utile si vous en avez beaucoup (proche de 10) : ça les couvre
#   toutes au fil du temps sans que chaque cycle devienne trop long. Revers
#   de la médaille : plus vous avez de catégories, moins chacune est
#   revérifiée souvent.
rotation: false


# --------------------------------------------------------------------------
# 3) PRIX MINIMUM (optionnel, fixe, appliqué à toutes les catégories)
# --------------------------------------------------------------------------
# Une seule valeur, appliquée telle quelle (price_from) à chaque recherche,
# à chaque cycle. Modifiez ce nombre pour changer le seuil partout d'un coup.
#
# Pour NE PAS filtrer par prix minimum : laissez la ligne vide comme ceci
# (ou supprimez complètement la ligne) :
#     prix_minimum:
prix_minimum: 80


# --------------------------------------------------------------------------
# 4) RYTHME DE SURVEILLANCE
# --------------------------------------------------------------------------
# Entre deux cycles, le script attend un temps aléatoire tiré entre "min" et
# "max" (en minutes) — jamais un intervalle pile fixe. Gardez des valeurs
# raisonnables : plus c'est fréquent, plus l'activité est repérable.
intervalle_minutes:
  min: 4
  max: 7


# --------------------------------------------------------------------------
# 5) FUSEAU HORAIRE
# --------------------------------------------------------------------------
# Utilisé pour la pause nocturne et pour l'affichage des heures dans les
# alertes. Laissez "Europe/Paris" si vous n'êtes pas sûr.
fuseau_horaire: "Europe/Paris"


# --------------------------------------------------------------------------
# 6) PAUSE NOCTURNE (optionnelle)
# --------------------------------------------------------------------------
# Aucune activité pendant cette plage horaire (par défaut minuit -> 7h),
# pour rester discret et ne pas avoir un comportement disponible 24h/24.
# Mettez "active: false" pour désactiver complètement la pause nocturne.
pause_nocturne:
  active: true
  heure_debut: 0   # 0 = minuit
  heure_fin: 7     # 7 = 7h du matin
  # S'arrêter à 00:00:00 pile et reprendre à 07:00:00 pile chaque jour est en
  # soi un comportement reconnaissable (aucun humain n'est aussi ponctuel).
  # Les deux bornes sont donc décalées aléatoirement de ± ce nombre de minutes,
  # avec un tirage différent chaque jour. Mettez 0 pour des horaires stricts.
  flou_minutes: 25


# --------------------------------------------------------------------------
# 7) NAVIGATEUR
# --------------------------------------------------------------------------
navigateur:
  headless: true        # true = pas de fenêtre visible ; false = fenêtre visible (pratique pour observer/déboguer)
  canal: "chromium"      # "chromium" (fourni avec Playwright) ou "chrome" (votre Google Chrome installé)
  largeur_fenetre: 1366
  hauteur_fenetre: 768


# --------------------------------------------------------------------------
# 8) VÉRIFICATION AVANT DE CONSIDÉRER UNE ANNONCE COMME DISPARUE
# --------------------------------------------------------------------------
# Quand une annonce suivie n'apparaît plus dans la zone surveillée, cela peut
# vouloir dire qu'elle a disparu... ou simplement qu'elle a glissé au-delà de
# la dernière page surveillée (de nouvelles annonces sont passées devant).
# En activant cette vérification, le script visite directement la page de
# l'annonce pour confirmer avant de l'annoncer comme disparue (recommandé) —
# en combinant plusieurs signaux (titre de la page, messages d'erreur
# visibles, absence de bouton d'achat et de prix affiché) plutôt qu'un seul,
# pour limiter le risque de fausses alertes.
#
# L'ordre de la file de vérification est décidé par utilité : les annonces
# dont l'âge est dans la fourchette de "vente rapide" (voir section 10) sont
# vérifiées en priorité, puisque ce sont les seules qui peuvent encore
# produire le signal recherché. Les autres restent suivies et sont servies
# plus tard — aucune annonce n'est jamais abandonnée.
verification_avant_disparition:
  active: true
  max_verifications_par_cycle: 25   # limite le nombre de pages-annonces vérifiées par cycle
  # Si une proportion anormale des vérifications d'un même cycle se solde par
  # une disparition (0.8 = 80 %), le motif ressemble plus à un vendeur qui
  # retire son stock qu'à une vague de ventes : ce lot est alors marqué
  # "douteux" et exclu du calcul des tendances (il reste visible ailleurs).
  seuil_rafale_douteuse: 0.8
  # Augmentez ce nombre si vous suivez beaucoup d'annonces (des centaines/milliers)
  # et que "Disparitions détectées" met trop longtemps à devenir représentatif.
  # Chaque vérification ajoute quelques secondes au cycle (pas d'inquiétude à
  # avoir en dessous d'une cinquantaine).


# --------------------------------------------------------------------------
# 9) SI VINTED SEMBLE BLOQUER LE SCRIPT (CAPTCHA, page de blocage...)
# --------------------------------------------------------------------------
# Le script ne cherche jamais à forcer le passage : il s'arrête et attend
# ce nombre de minutes avant de réessayer.
pause_si_blocage_minutes: 60


# --------------------------------------------------------------------------
# 10) NOTIFICATIONS
# --------------------------------------------------------------------------
# Le résumé s'affiche toujours dans le terminal. Discord/Telegram sont
# optionnels, à activer seulement si vous voulez aussi une notification sur
# votre téléphone/PC en dehors du terminal.
notifications:
  discord:
    active: true
    # Volontairement laissé vide ICI : ce fichier est publié sur un dépôt
    # GitHub PUBLIC, et un webhook Discord écrit en clair s'y ferait très
    # vite récupérer par des robots qui scannent GitHub en continu. Donnez
    # plutôt la vraie URL via la variable d'environnement
    # VINTED_DISCORD_WEBHOOK (voir le README) : elle est prioritaire sur
    # cette ligne et ne quitte jamais votre PC.
    webhook_url: ""
  telegram:
    active: false
    bot_token: ""        # voir le README pour savoir comment créer un bot Telegram
    chat_id: ""

  # "Vente rapide" = fourchette de temps entre la première observation et la
  # disparition confirmée. En dessous du minimum, c'est le plus souvent un
  # faux positif (annonce supprimée puis republiée par ex.) plutôt qu'une
  # vraie vente-éclair ; au-dessus du maximum, ce n'est plus vraiment
  # "rapide". Seules les disparitions DANS cette fourchette déclenchent une
  # notification Discord/Telegram (le terminal, lui, affiche toujours TOUTES
  # les disparitions confirmées). Laissez min_minutes/max_minutes vides pour
  # toujours notifier, quelle que soit la vitesse.
  seuil_vente_rapide:
    min_minutes: 2
    max_minutes: 120


# --------------------------------------------------------------------------
# 11) STOCKAGE (fichiers créés automatiquement par le script)
# --------------------------------------------------------------------------
stockage:
  base_donnees: "vinted_monitor.db"          # mémoire des annonces déjà vues (SQLite)
  session_navigateur: "storage_state.json"    # cookies/session, pour ne pas repartir de zéro à chaque cycle


# --------------------------------------------------------------------------
# 12) LOGS
# --------------------------------------------------------------------------
logs:
  fichier: "vinted_monitor.log"
  niveau: "INFO"   # DEBUG (très détaillé), INFO (recommandé), WARNING, ERROR


# --------------------------------------------------------------------------
# 13) PAUSE MANUELLE
# --------------------------------------------------------------------------
# Pour mettre le script en pause sans l'arrêter : créez un fichier vide avec
# ce nom dans le même dossier. Supprimez-le pour reprendre. Voir le README.
fichier_pause: "PAUSE"
